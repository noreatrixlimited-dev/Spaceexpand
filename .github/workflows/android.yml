name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web game
        run: npm run build

      - name: Copy game into Android project
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Nestnappers-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Nestnappers-apk
          path: Nestnappers-build*.apk

      - name: Publish as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Nestnappers build ${{ github.run_number }}
          prerelease: true
          files: Nestnappers-build*.apk
          body: |
            Download the `.apk` below and open it on your Android phone to install.
            (You may need to allow "Install unknown apps" for your browser or file manager.)
